<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party photos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 720px; background: #1c0933; color: #fff6fe; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  h1 { font-size: 28px; margin: 6px 0 14px; }
  .hero { border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; }
  .hero video, .hero img { width: 100%; display: block; }
  .btn { display: block; width: 100%; font: inherit; font-size: 17px; font-weight: 800; padding: 14px;
         border-radius: 999px; border: 0; background: #a8ff1f; color: #12051f; margin: 0 0 8px; cursor: pointer; text-align: center; text-decoration: none; }
  .btn.alt { background: #8a3cff; color: #fff6fe; }
  .btn:disabled { opacity: .6; }
  .hint { color: rgba(255, 246, 254, .6); font-size: 13px; text-align: center; margin: 0 0 18px; }
  details { border-top: 1px solid rgba(255, 246, 254, .18); }
  summary { cursor: pointer; list-style: none; font-size: 20px; font-weight: 800; padding: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 26px; color: #a8ff1f; }
  details[open] summary::after { content: "–"; }
  .pics { display: grid; gap: 10px; padding-bottom: 18px; }
  .pics a { display: block; border-radius: 10px; overflow: hidden; background: #000; }
  .pics img { width: 100%; display: block; }
  .pics.two { grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div id="top"></div>
  <p class="hint">Tap a picture to open it full size, or press and hold to save it.</p>
  <details><summary>4-Up</summary><div class="pics" id="prints"></div></details>
  <details><summary>Singles</summary><div class="pics two" id="singles"></div></details>
<script>
const D = /*DATA*/;
const $ = s => document.querySelector(s);
$("#title").textContent = D.title; document.title = D.title;

async function shareFiles(list, btn, label) {
  btn.disabled = true; btn.textContent = "Getting it…";
  try {
    const files = [];
    for (const f of list) {
      const blob = await (await fetch(f.src)).blob();
      files.push(new File([blob], f.name, { type: f.type }));
    }
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); btn.textContent = "Saved"; }
    else { btn.textContent = label; $(".hint").textContent = "Press and hold a picture, then choose Save."; }
  } catch (e) { btn.textContent = label; }
  btn.disabled = false;
}

const hero = $("#top");
if (D.video) {
  hero.innerHTML = `<div class="hero"><video src="${D.video}" autoplay muted loop playsinline></video></div><button class="btn" id="saveTop">Save the video</button>`;
  $("#saveTop").onclick = () => shareFiles([{ src: D.video, name: "party.mp4", type: "video/mp4" }], $("#saveTop"), "Save the video");
} else if (D.gif) {
  hero.innerHTML = `<div class="hero"><img src="${D.gif}" alt=""></div><button class="btn" id="saveTop">Save the GIF</button>`;
  $("#saveTop").onclick = () => shareFiles([{ src: D.gif, name: "party.gif", type: "image/gif" }], $("#saveTop"), "Save the GIF");
}
if (D.dropbox) hero.insertAdjacentHTML("beforeend", `<a class="btn alt" href="${D.dropbox}" target="_blank">Everything on Dropbox</a>`);

const pic = p => `<a href="${p}" target="_blank"><img src="${p}" loading="lazy" alt=""></a>`;
$("#prints").innerHTML = D.sessions.filter(s => s.print).map(s => pic(s.print)).join("");
$("#singles").innerHTML = D.sessions.flatMap(s => s.shots).map(pic).join("");
</script>
</body>
</html>
