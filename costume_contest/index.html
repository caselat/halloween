  --ink:#140a20;--white:#faf5fb;--muted:#b6a6cf;
  --field:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--err:#ff8f8f
}
*{box-sizing:border-box}
html{background:var(--bottom)}
body{margin:0;min-height:100vh;color:var(--white);
  background:linear-gradient(180deg,var(--top) 0,var(--mid) 42%,var(--bottom) 100%) fixed;
  font:600 17px/1.4 Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;padding:max(36px,env(safe-area-inset-top)) 18px 40px}

/* headline */
.head{text-align:center;margin-bottom:28px}
h1{font-family:Gorvex,Figtree,sans-serif;font-weight:400;text-transform:uppercase;color:var(--lime);
  font-size:clamp(32px,11vw,62px);line-height:.95;margin:0;letter-spacing:.01em;
  text-shadow:0 4px 0 rgba(10,4,20,.35)}
.tag{font-weight:800;font-size:20px;margin:12px 0 0;min-height:1.4em}
.lede{color:var(--muted);text-align:center;margin:0 0 8px}

/* fields */
label.f{display:block;font-weight:800;font-size:15px;letter-spacing:.02em;margin:22px 0 8px}
.hint{font-weight:600;color:var(--muted);font-size:14px;letter-spacing:0}
input[type=text],input[type=password]{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);
  background:var(--field);color:var(--white);font:inherit;font-size:18px;font-weight:700}
input::placeholder{color:rgba(250,245,251,.4)}
input:focus{outline:none;border-color:var(--lime)}

/* category pills + choice cards */
.pills{display:flex;gap:12px}
.pill,.choice{-webkit-appearance:none;appearance:none;font:inherit;color:var(--white);cursor:pointer;
  background:var(--field);border:2px solid var(--line);border-radius:18px;
  transition:transform .08s ease,background .12s ease}
.pill{flex:1;padding:16px;font-weight:900;font-size:19px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;margin:10px 0;text-align:left;font-weight:800;font-size:18px}
.choice small{display:block;font-weight:700;font-size:14px;color:var(--muted);margin-top:1px}
.choice.new{border-style:dashed}
.pill:active,.choice:active,.btn:active,.op:active{transform:translateY(2px)}
.pill.on,.choice.on{background:var(--orange);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 5px 0 var(--ink)}
.choice.on small{color:rgba(20,10,32,.7)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line)}
.choice.on .dot{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 5px var(--orange)}
.sub{margin-top:2px}

/* ballot */
.cat{margin-top:34px}
.cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:4px}
.cat h2{font-family:Gorvex,Figtree,sans-serif;font-weight:400;text-transform:uppercase;color:var(--lime);font-size:32px;line-height:1;margin:0}
.count{font-weight:900;color:var(--muted);white-space:nowrap}
.count.done{color:var(--lime)}

/* buttons */
.btn{display:block;width:100%;margin-top:30px;padding:19px;border:0;border-radius:999px;
  background:var(--lime);color:var(--ink);font:inherit;font-weight:900;font-size:22px;letter-spacing:-.01em;cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.35)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.alt{background:var(--purple);color:var(--white)}
.err{color:var(--err);margin-top:14px;min-height:1.3em;text-align:center;font-weight:700}

/* done screens */
.big{text-align:center;padding-top:8px}
.big .icon{font-size:64px;line-height:1}
.big h2{font-family:Gorvex,Figtree,sans-serif;font-weight:400;text-transform:uppercase;color:var(--lime);font-size:48px;line-height:1;margin:16px 0 10px}
.hide{display:none!important}

/* results */
.winner{margin:14px 0 20px;padding:20px 18px;border-radius:22px;background:var(--orange);color:var(--ink);
  border:3px solid var(--ink);box-shadow:3px 6px 0 var(--ink);text-align:center}
.winner .crown{font-size:42px;line-height:1}
.winner .who{font-weight:900;font-size:26px;line-height:1.15;margin-top:8px}
.winner .votes{font-weight:800;font-size:15px;opacity:.75;margin-top:6px}
.chart{display:flex;gap:20px;align-items:center}
.chart svg{flex:none;width:150px;height:150px}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0}
.legend li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:5px 0}
.legend .sw{flex:none;width:14px;height:14px;border-radius:4px}
.legend .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pct{font-weight:900;color:var(--muted)}
@media (max-width:440px){.chart{flex-direction:column}.chart svg{width:210px;height:210px}.legend{width:100%}}

/* admin */
.foot{margin-top:72px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}
.admin{margin-top:10px;padding:18px;border:2px solid var(--line);border-radius:22px;background:rgba(10,4,20,.45);text-align:left}
.admin h3{margin:0 0 4px;font-size:16px;font-weight:900}
.admin .meta{color:var(--muted);font-size:14px;margin:0 0 14px}
.admin .row{display:flex;gap:8px;margin-top:10px;align-items:center}
.admin .row input{flex:1;padding:12px 14px;font-size:16px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{padding:13px 10px;border-radius:999px;border:0;background:var(--purple);color:var(--white);font:inherit;font-size:15px;font-weight:900;cursor:pointer}
.op.primary{background:var(--lime);color:var(--ink)}
.op.wide{grid-column:1/-1}
.op.danger{background:transparent;color:var(--err);border:2px solid rgba(255,143,143,.45)}
.op:disabled{opacity:.4}
.tally{margin-top:18px}
.tally table{width:100%;border-collapse:collapse;font-size:14px}
.tally td{padding:7px 0;border-bottom:1px solid var(--line)}
.tally td:last-child{text-align:right;font-weight:900;width:48px;color:var(--lime)}
.glist{font-size:14px;color:var(--muted);margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
<header class="head">
  <h1 id="title">Helloweiners</h1>
  <p class="tag" id="tag"></p>
</header>
<p class="lede" id="loading">Loading...</p>

<section id="entry" class="hide">
  <form id="entryForm" autocomplete="off">
    <label class="f" for="name">Your name</label>
    <input type="text" id="name">

    <label class="f">Part of a group costume?</label>
    <div class="pills">
      <button type="button" class="pill" data-grp="yes">Yes</button>
      <button type="button" class="pill" data-grp="no">No, solo</button>
    </div>

    <div id="groupFields" class="hide">
      <label class="f" id="groupLabel">Your group</label>
      <div id="groupList"></div>
      <div id="newGroup" class="hide sub">
        <label class="f" for="group">Group name</label>
        <input type="text" id="group">
      </div>
    </div>

    <div id="indFields" class="hide">
      <label class="f" for="costume" id="costumeLabel">Costume</label>
      <input type="text" id="costume">
    </div>

    <button class="btn" id="entryBtn" type="submit">Enter</button>
    <div class="err" id="entryErr"></div>
  </form>
  <p class="lede" style="margin-top:6px">Voting happens here. Come back then</p>
</section>

<section id="entryDone" class="hide big">
  <div class="icon">🎃</div>
  <h2>You're in</h2>
  <p class="lede">Leave this page open. It switches to the ballot when voting starts.</p>
  <button class="btn alt" id="again">Enter another costume</button>
</section>

<section id="vote" class="hide">
  <div id="ballot"></div>
  <button class="btn" id="voteBtn" disabled>Votes</button>
  <div class="err" id="voteErr"></div>
</section>

<section id="voteDone" class="hide big">
  <div class="icon">🗳️</div>
  <h2>Ballot in</h2>
  <p class="lede">Winners announced soon.</p>
</section>

<section id="closed" class="hide big">
  <div class="icon">🦇</div>
  <h2>Wrapped</h2>
  <p class="lede">Winners coming up.</p>
</section>

<section id="results" class="hide"><div id="resultsBody"></div></section>

<div class="foot">
  <button class="linkbtn" id="adminLink">Admin</button>
  <div class="admin hide" id="admin">
    <div id="pinBox">
      <h3>Admin</h3>
      <div class="row">
        <input type="password" id="pin" inputmode="numeric" placeholder="Password">
        <button class="op primary" id="pinBtn">Unlock</button>
      </div>
    </div>
    <div id="adminPanel" class="hide">
      <h3 id="adminPhase"></h3>
      <p class="meta" id="adminCounts"></p>
      <div class="ops">
        <button class="op" data-op="entry">Open sign-ups</button>
        <button class="op" data-op="voting">Open voting</button>
        <button class="op" data-op="closed">Close voting</button>
        <button class="op primary wide" data-op="announce">Announce winners</button>
        <button class="op" data-op="rebuild">Rebuild ballot</button>
        <button class="op" data-op="status">Refresh</button>
        <button class="op danger" data-op="reset">Reset all data</button>
      </div>
      <div id="adminGroups"></div>
      <div id="adminTally"></div>
      <div class="row"><button class="linkbtn" id="lockBtn">Lock admin</button></div>
    </div>
    <div class="err" id="adminErr"></div>
  </div>
</div>
</div>

<script>
// Your Apps Script Web app URL (ends in /exec)
var API = 'https://script.google.com/macros/s/AKfycbzndroU3aUvZD3Oix26Nv_KTmuEOW1HneW-rAqSbE2l3ilQj819zXLhN8Ovh6ADroNo/exec';

var NEW = '__new__';
var state = null, picks = {}, sending = false, groupSel = null, adminPin = '';
var VIEWS = ['loading','entry','entryDone','vote','voteDone','closed','results'];
var TAGS = { entry: 'Costume Contest', voting: 'Pickem', closed: 'Voting is closed', results: 'Winners...' };
var PIE = ['#c3f55a','#f0883e','#8445f5','#ff5fa2','#4fd8e8','#ffd23f'];
function $(id){ return document.getElementById(id); }
function el(tag, cls){ var e = document.createElement(tag); if (cls) e.className = cls; return e; }
function show(id){ VIEWS.forEach(function(v){ $(v).classList.toggle('hide', v !== id); }); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function ssGet(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }
function ssSet(k,v){ try { if (v) sessionStorage.setItem(k,v); else sessionStorage.removeItem(k); } catch(e){} }
function setErr(id, t){ $(id).textContent = t || ''; return false; }

// POST goes as plain text so the browser skips the CORS preflight Apps Script can't answer.
function api(method, payload){
  var opts = method === 'POST' ? { method: 'POST', body: JSON.stringify(payload) } : { method: 'GET' };
  var url = method === 'POST' ? API : API + '?action=state&t=' + Date.now();
  return fetch(url, opts).then(function(r){
    return r.text().then(function(txt){
      try { return JSON.parse(txt); }
      catch (e) { throw new Error('Backend sent a page instead of data. Deploy a new version of the script.'); }
    });
  }, function(){
    throw new Error('Could not reach the backend. Check the deployment is set to Anyone.');
  }).then(function(res){
    if (!res.ok) throw new Error(res.error || 'Something went wrong.');
    return res.data;
  });
}

/* ----- public page ----- */
function load(first){
  return api('GET').then(function(s){
    var prev = state;
    state = s;
    var phaseChanged = !prev || prev.phase !== s.phase || prev.ver !== s.ver;
    var ballotChanged = prev && prev.bver !== s.bver;
    if (phaseChanged) render();
    else if (s.phase === 'voting' && ballotChanged && !anyPicks() && !sending && !lsGet('cc_voted_' + s.ver)) buildBallot();
    else if (s.phase === 'entry') renderGroups();
  }).catch(function(err){
    if (first) $('loading').textContent = 'Could not load. ' + err.message;
  });
}

function render(){
  var p = state.phase;
  $('tag').textContent = TAGS[p] || '';
  if (p === 'entry') {
    renderGroups();
    show(lsGet('cc_entered_' + state.ver) ? 'entryDone' : 'entry');
  } else if (p === 'voting') {
    if (lsGet('cc_voted_' + state.ver)) { show('voteDone'); return; }
    buildBallot(); show('vote');
  } else if (p === 'results') {
    buildResults(); show('results');
  } else {
    show('closed');
  }
}

/* ----- results ----- */
function buildResults(){
  var root = $('resultsBody'); root.innerHTML = '';
  (state.results || []).forEach(function(t){
    var sec = el('div','cat'), h = el('h2');
    h.textContent = t.title.replace(/ Costume$/, ''); sec.appendChild(h);
    var rows = t.rows.filter(function(r){ return r[1] > 0; });
    var total = rows.reduce(function(a, r){ return a + r[1]; }, 0);
    if (!total) {
      var none = el('p','lede'); none.style.textAlign = 'left'; none.style.marginTop = '10px';
      none.textContent = 'No votes in this one.'; sec.appendChild(none); root.appendChild(sec); return;
    }
    var top = rows[0][1];
    var winners = rows.filter(function(r){ return r[1] === top; });
    var w = el('div','winner'), crown = el('div','crown');
    crown.textContent = '🏆'; w.appendChild(crown);
    if (winners.length > 1) { var tie = el('div','votes'); tie.textContent = "It's a tie"; w.appendChild(tie); }
    winners.forEach(function(r){ var who = el('div','who'); who.textContent = r[0]; w.appendChild(who); });
    var v = el('div','votes');
    v.textContent = top + (top === 1 ? ' vote' : ' votes') + (winners.length > 1 ? ' each' : '');
    w.appendChild(v); sec.appendChild(w);

    var slices = rows.slice(0, 5).map(function(r){ return { label: r[0], n: r[1] }; });
    if (rows.length > 5) {
      slices.push({ label: 'Everyone else', n: rows.slice(5).reduce(function(a, r){ return a + r[1]; }, 0) });
    }
    var chart = el('div','chart'), ul = el('ul','legend');
    chart.appendChild(pie(slices, total));
    slices.forEach(function(sl, i){
      var li = el('li'), sw = el('span','sw'), lb = el('span','lbl'), pc = el('span','pct');
      sw.style.background = PIE[i % PIE.length];
      lb.textContent = sl.label;
      pc.textContent = Math.round(sl.n / total * 100) + '%';
      li.appendChild(sw); li.appendChild(lb); li.appendChild(pc); ul.appendChild(li);
    });
    chart.appendChild(ul); sec.appendChild(chart); root.appendChild(sec);
  });
}

function pie(slices, total){
  var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'), a0 = -Math.PI / 2;
  svg.setAttribute('viewBox', '-52 -52 104 104');
  slices.forEach(function(sl, i){
    var frac = sl.n / total, node;
    if (frac >= 0.9999) {
      node = document.createElementNS(NS, 'circle'); node.setAttribute('r', '48');
    } else {
      var a1 = a0 + frac * 2 * Math.PI;
      node = document.createElementNS(NS, 'path');
      node.setAttribute('d', 'M0 0 L' + (48 * Math.cos(a0)).toFixed(2) + ' ' + (48 * Math.sin(a0)).toFixed(2) +
        ' A48 48 0 ' + (frac > 0.5 ? 1 : 0) + ' 1 ' + (48 * Math.cos(a1)).toFixed(2) + ' ' + (48 * Math.sin(a1)).toFixed(2) + ' Z');
      a0 = a1;
    }
    node.setAttribute('fill', PIE[i % PIE.length]);
    node.setAttribute('stroke', '#140a20'); node.setAttribute('stroke-width', '2.5'); node.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(node);
  });
  return svg;
}

function choiceBtn(main, sub, on, cls, onclick){
  var b = el('button', 'choice' + (on ? ' on' : '') + (cls ? ' ' + cls : ''));
  b.type = 'button';
  b.appendChild(el('span','dot'));
  var t = el('span'); t.textContent = main;
  if (sub) { var s = el('small'); s.textContent = sub; t.appendChild(s); }
  b.appendChild(t);
  b.onclick = onclick;
  return b;
}

/* ----- entry ----- */
function renderGroups(){
  var groups = (state && state.groups) || [];
  var list = $('groupList'); list.innerHTML = '';
  if (groupSel && groupSel !== NEW && !groups.some(function(g){ return g.name === groupSel; })) groupSel = null;
  if (!groups.length) groupSel = NEW;
  $('groupLabel').textContent = groups.length ? 'Join your group, or start one' : 'Start your group';
  groups.forEach(function(g){
    var who = g.members + (g.members === 1 ? ' person' : ' people') + ' so far';
    list.appendChild(choiceBtn(g.name, who, groupSel === g.name, '', function(){
      groupSel = g.name; renderGroups();
    }));
  });
  if (groups.length) {
    list.appendChild(choiceBtn('Start a new group', 'if not listed', groupSel === NEW, 'new', function(){
      groupSel = NEW; renderGroups();
    }));
  }
  $('newGroup').classList.toggle('hide', groupSel !== NEW);
}

var inGroup = null; // null until they answer "Part of a group costume?"

Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(b){
  b.onclick = function(){
    inGroup = b.getAttribute('data-grp') === 'yes';
    Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(x){ x.classList.toggle('on', x === b); });
    $('groupFields').classList.toggle('hide', !inGroup);
    $('indFields').classList.remove('hide');
    $('costumeLabel').innerHTML = inGroup
      ? 'Your costume <span class="hint">optional, also enters you solo</span>'
      : 'Costume';
    setErr('entryErr');
  };
});

$('entryForm').onsubmit = function(e){
  e.preventDefault();
  if (sending) return;
  var name = $('name').value.trim(), costume = $('costume').value.trim();
  if (!name) return setErr('entryErr', 'Add your name.');
  if (inGroup === null) return setErr('entryErr', 'Part of a group costume? Pick Yes or No.');
  if (!inGroup && !costume) return setErr('entryErr', 'Add your costume.');
  var cats = [];
  if (costume) cats.push('Individual');
  if (inGroup) cats.push('Group');
  var d = { name: name, categories: cats, costume: costume };
  if (inGroup) {
    if (!groupSel) return setErr('entryErr', 'Pick your group, or start a new one.');
    if (groupSel === NEW) {
      d.groupMode = 'new'; d.group = $('group').value;
      if (!d.group.trim()) return setErr('entryErr', 'Add your group name.');
    } else {
      d.groupMode = 'existing'; d.group = groupSel;
    }
  }
  setErr('entryErr'); sending = true;
  $('entryBtn').disabled = true; $('entryBtn').textContent = 'Entering...';
  api('POST', { action: 'entry', data: d }).then(function(){
    lsSet('cc_entered_' + state.ver, '1');
    show('entryDone');
    load(false);
  }).catch(function(err){
    setErr('entryErr', err.message);
  }).then(function(){
    sending = false;
    $('entryBtn').disabled = false; $('entryBtn').textContent = 'Enter';
  });
};

$('again').onclick = function(){
  ['name','costume','group'].forEach(function(id){ $(id).value = ''; });
  inGroup = null; groupSel = null;
  Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(b){ b.classList.remove('on'); });
  $('indFields').classList.add('hide');
  $('groupFields').classList.add('hide');
  renderGroups();
  show('entry');
};

/* ----- voting ----- */
function anyPicks(){ return Object.keys(picks).some(function(k){ return picks[k].length; }); }

function buildBallot(){
  picks = {};
  var root = $('ballot'); root.innerHTML = '';
  if (!state.ballot.length) { root.textContent = 'Nothing on the ballot yet.'; checkReady(); return; }
  state.ballot.forEach(function(cat){
    picks[cat.title] = [];
    var btns = {};
    var sec = el('div','cat'), head = el('div','cat-head'), h = el('h2'), cnt = el('span','count');
    h.textContent = cat.title.replace(/ Costume$/, ''); head.appendChild(h); head.appendChild(cnt); sec.appendChild(head);
    function upd(){
      var n = picks[cat.title].length;
      cnt.textContent = n + ' of ' + cat.pick;
      cnt.classList.toggle('done', n === cat.pick);
      checkReady();
    }
    cat.choices.forEach(function(ch){
      var b = choiceBtn(ch, '', false, '', function(){
        var arr = picks[cat.title], i = arr.indexOf(ch);
        if (i > -1) { arr.splice(i, 1); b.classList.remove('on'); }
        else {
          if (arr.length >= cat.pick) { var old = arr.shift(); btns[old].classList.remove('on'); }
          arr.push(ch); b.classList.add('on');
        }
        upd();
      });
      btns[ch] = b;
      sec.appendChild(b);
    });
    root.appendChild(sec); upd();
  });
}

function checkReady(){
  var ok = state && state.ballot.length > 0 &&
    state.ballot.every(function(c){ return picks[c.title] && picks[c.title].length === c.pick; });
  $('voteBtn').disabled = !ok || sending;
}

// Anonymous voting: each phone gets a random ID so it can only vote once.
function deviceId(){
  var id = lsGet('cc_device');
  if (!id) {
    id = '';
    for (var i = 0; i < 24; i++) id += 'abcdefghijklmnopqrstuvwxyz0123456789'.charAt(Math.floor(Math.random() * 36));
    lsSet('cc_device', id);
    window.__ccDevice = window.__ccDevice || id; // fallback if storage is blocked
  }
  return lsGet('cc_device') || window.__ccDevice || id;
}

$('voteBtn').onclick = function(){
  if (sending) return;
  sending = true; setErr('voteErr');
  $('voteBtn').disabled = true; $('voteBtn').textContent = 'Sending...';
  api('POST', { action: 'vote', data: { device: deviceId(), picks: picks } }).then(function(){
    lsSet('cc_voted_' + state.ver, '1'); show('voteDone');
  }).catch(function(err){
    setErr('voteErr', err.message);
  }).then(function(){
    sending = false; $('voteBtn').textContent = 'Votes'; checkReady();
  });
};

/* ----- admin ----- */
var PHASE_NAMES = { entry: 'Sign-ups open', voting: 'Voting open', closed: 'Voting closed', results: 'Winners announced' };
var CONFIRM = {
  voting: 'Close sign-ups and open voting?',
  closed: 'Close voting? Nobody else can vote after this.',
  announce: "Show the winners on everyone's screen? This also closes voting.",
  entry: 'Go back to sign-ups? Voting will stop.',
  reset: 'Delete every entry and every vote, and go back to sign-ups? This cannot be undone.'
};

$('adminLink').onclick = function(){
  var a = $('admin');
  a.classList.toggle('hide');
  if (!a.classList.contains('hide') && adminPin) runAdmin('status');
};
$('pinBtn').onclick = function(){ adminPin = $('pin').value.trim(); runAdmin('status'); };
$('pin').onkeydown = function(e){ if (e.key === 'Enter') $('pinBtn').click(); };
$('lockBtn').onclick = function(){
  adminPin = ''; ssSet('cc_pin', ''); $('pin').value = '';
  $('adminPanel').classList.add('hide'); $('pinBox').classList.remove('hide');
};
Array.prototype.forEach.call(document.querySelectorAll('.op[data-op]'), function(b){
  b.onclick = function(){ runAdmin(b.getAttribute('data-op')); };
});

var adminPhase = null;
var OP_ALLOWED = {
  closed:   function(p){ return p === 'voting'; },
  announce: function(p){ return p === 'voting' || p === 'closed'; }
};
function setOpsBusy(on){
  Array.prototype.forEach.call(document.querySelectorAll('.op'), function(b){
    var op = b.getAttribute('data-op');
    b.disabled = on || !!(op && OP_ALLOWED[op] && adminPhase && !OP_ALLOWED[op](adminPhase));
  });
}

function runAdmin(op){
  if (CONFIRM[op] && !confirm(CONFIRM[op])) return;
  setErr('adminErr', op === 'status' ? '' : 'Working...');
  setOpsBusy(true);
  api('POST', { action: 'admin', data: { pin: adminPin, op: op } }).then(function(st){
    ssSet('cc_pin', adminPin);
    setErr('adminErr', st.note || '');
    showAdmin(st);
    if (op !== 'status') load(false);
  }).catch(function(err){
    setErr('adminErr', err.message);
    if (/password/i.test(err.message)) $('lockBtn').click();
  }).then(function(){ setOpsBusy(false); });
}

function showAdmin(st){
  $('pinBox').classList.add('hide');
  $('adminPanel').classList.remove('hide');
  adminPhase = st.phase;
  $('adminPhase').textContent = PHASE_NAMES[st.phase] || st.phase;
  $('adminCounts').textContent = st.people + ' sign-ups: ' + st.individuals + ' individual entries, ' +
    st.groups.length + ' groups. ' + st.ballots + ' ballots in' +
    (st.ignored ? ', ' + st.ignored + ' repeats ignored.' : '.');

  var gWrap = $('adminGroups'); gWrap.innerHTML = '';
  if (st.groups.length) {
    var gh = el('h3'); gh.textContent = 'Groups'; gh.style.marginTop = '18px'; gWrap.appendChild(gh);
    var ul = el('ul', 'glist');
    st.groups.forEach(function(g){
      var li = el('li'); li.textContent = g.name + ' (' + g.members + ')'; ul.appendChild(li);
    });
    gWrap.appendChild(ul);
  }

  var tWrap = $('adminTally'); tWrap.innerHTML = '';
  st.tallies.forEach(function(t){
    var box = el('div','tally'), h = el('h3'), table = el('table');
    h.textContent = t.title; box.appendChild(h);
    t.rows.forEach(function(r){
      var tr = el('tr'), a = el('td'), b = el('td');
      a.textContent = r[0]; b.textContent = r[1];
      tr.appendChild(a); tr.appendChild(b); table.appendChild(tr);
    });
    box.appendChild(table); tWrap.appendChild(box);
  });
}

adminPin = ssGet('cc_pin');
load(true);
setInterval(function(){ load(false); }, 20000);
</script>
</body>
</html>
