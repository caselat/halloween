<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 720px; background: #1c0933; color: #fff6fe; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;

  .btn { display: block; width: 100%; font: inherit; font-size: 17px; font-weight: 800; padding: 14px;

  .hint { color: rgba(255, 246, 254, .6); font-size: 13px; text-align: center; margin: 0 0 8px; }
  .set { border-top: 1px solid rgba(255, 246, 254, .18); padding-top: 18px; margin-top: 18px; }
  .set .gif { display: block; border-radius: 12px; overflow: hidden; background: #000; }
  .set .gif img { width: 100%; display: block; }
  details { margin-top: 8px; }
  summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border: 2px solid rgba(255, 246, 254, .5); border-radius: 999px;
            font-size: 16px; font-weight: 800; color: #fff6fe; -webkit-tap-highlight-color: transparent; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; width: 10px; height: 10px; margin-right: 4px; border-right: 3px solid #a8ff1f; border-bottom: 3px solid #a8ff1f;
                   transform: translateY(-3px) rotate(45deg); transition: transform .2s; }
  details[open] summary { border-color: #a8ff1f; }
  details[open] summary::after { transform: translateY(3px) rotate(-135deg); }
  summary .show { display: inline; } summary .hide { display: none; }
  details[open] summary .show { display: none; } details[open] summary .hide { display: inline; }
  .pics { display: grid; gap: 8px; padding: 10px 0 4px; }
  .pics a { display: block; border-radius: 10px; overflow: hidden; background: #000; }
  .pics img { width: 100%; display: block; }
  .pics.two { grid-template-columns: 1fr 1fr; }
  .set .btn { font-size: 15px; padding: 11px; margin: 8px 0 0; }
</style>

const $ = s => document.querySelector(s);
$("#title").textContent = D.title; document.title = D.title;

async function shareFiles(list, btn, label) {
  btn.disabled = true; btn.textContent = "Getting it…";
  try {
    const files = [];
    for (const f of list) {
      const blob = await (await fetch(f.src)).blob();
      files.push(new File([blob], f.name, { type: f.type }));
    }
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); btn.textContent = "Saved"; }
    else { btn.textContent = label; $(".hint").textContent = "Press and hold a picture, then choose Save."; }
  } catch (e) { btn.textContent = label; }
  btn.disabled = false;
}

const hero = $("#top");
if (D.video) {
  hero.innerHTML = `<div class="hero"><video src="${D.video}" autoplay muted loop playsinline></video></div><button class="btn" id="saveTop">Save the video</button>`;
  $("#saveTop").onclick = () => shareFiles([{ src: D.video, name: "party.mp4", type: "video/mp4" }], $("#saveTop"), "Save the video");
} else if (D.gif) {
  hero.innerHTML = `<div class="hero"><img src="${D.gif}" alt=""></div><button class="btn" id="saveTop">Save the GIF</button>`;
  $("#saveTop").onclick = () => shareFiles([{ src: D.gif, name: "party.gif", type: "image/gif" }], $("#saveTop"), "Save the GIF");
}

const pic = p => `<a href="${p}" target="_blank"><img src="${p}" loading="lazy" alt=""></a>`;
const sets = $("#sets");
for (const s of D.sessions) {
  const el = document.createElement("section"); el.className = "set";
  el.innerHTML = (s.gif ? `<a class="gif" href="${s.gif}" target="_blank"><img src="${s.gif}" loading="lazy" alt=""></a>` : "") +
    (s.print ? `<details><summary><span>4-Up</span></summary><div class="pics">${pic(s.print)}</div></details>` : "") +
    (s.shots.length ? `<details><summary><span>Singles</span></summary><div class="pics two">${s.shots.map(pic).join("")}</div></details>` : "") +
    `<button class="btn">Save</button>`;
  el.querySelector("button").onclick = e => {
    const list = [];
    if (s.gif) list.push({ src: s.gif, name: `${s.id}_animation.gif`, type: "image/gif" });
    if (s.print) list.push({ src: s.print, name: `${s.id}_4up.jpg`, type: "image/jpeg" });
    s.shots.forEach((p, i) => list.push({ src: p, name: `${s.id}_photo${i + 1}.jpg`, type: "image/jpeg" }));
    shareFiles(list, e.target, "Save");
  };
  sets.appendChild(el);
}
